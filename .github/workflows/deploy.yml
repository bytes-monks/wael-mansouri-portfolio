name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Fixed group with cancel-in-progress: false — pushes QUEUE rather than cancel
# each other. Cancelling a half-finished Pages deploy leaves the live site in
# an indeterminate state; serialising is the lesser evil.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: scripts/prerender.mjs dates sitemap <lastmod> from
          # the last commit. A shallow clone still works but is less honest.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` = images -> tsc -> vite build -> vite build --ssr ->
      # prerender. Any stage failing aborts the deploy. prerender also fails
      # if public/CNAME and SITE_URL (src/lib/site.ts) disagree.
      - name: Build
        run: npm run build
        env:
          # '/' because the site is served from the custom domain root.
          BASE_URL: /
          # Repository variables (Settings -> Secrets and variables -> Actions
          # -> Variables). Both are public by nature — they end up in the
          # shipped JavaScript — so they are variables, not secrets.
          VITE_WHATSAPP: ${{ vars.VITE_WHATSAPP }}
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}

      # The custom domain reaches dist/ through public/CNAME, which Vite copies
      # verbatim. Set the same domain in Settings -> Pages -> Custom domain.
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
