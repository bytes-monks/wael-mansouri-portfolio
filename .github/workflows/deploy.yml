name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Fixed group with cancel-in-progress: false — pushes QUEUE rather than cancel
# each other. Cancelling a half-finished Pages deploy leaves the live site in
# an indeterminate state; serialising is the lesser evil.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: scripts/prerender.mjs dates sitemap <lastmod> from
          # the last commit. A shallow clone still works but is less honest.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs before the build because its outputs ARE the build's address:
      # with no custom domain set, base_url is
      #   https://bytes-monks.github.io/wael-mansouri-portfolio  (base_path /wael-mansouri-portfolio)
      # and once Settings -> Pages -> Custom domain is waelmansouri.com,
      #   https://waelmansouri.com                              (base_path empty)
      # Changing the domain does not trigger a deploy: re-run this workflow so
      # canonical links, the sitemap and asset paths follow.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # `npm run build` = images -> tsc -> vite build -> vite build --ssr ->
      # prerender. Any stage failing aborts the deploy. prerender also fails
      # if any asset URL escapes BASE_URL.
      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_URL: ${{ steps.pages.outputs.base_path }}/
          # Repository variables (Settings -> Secrets and variables -> Actions
          # -> Variables). Both are public by nature — they end up in the
          # shipped JavaScript — so they are variables, not secrets.
          VITE_WHATSAPP: ${{ vars.VITE_WHATSAPP }}
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
